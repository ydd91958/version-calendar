function applyOp(obj, op){
  var o = obj;
  for (var i=0; i<op.path.length-1; i++){
    var k = op.path[i];
    if (o[k] == null || typeof o[k] !== 'object') o[k] = {};
    o = o[k];
  }
  var last = op.path[op.path.length-1];
  if (op.v === undefined || op.v === null) delete o[last]; else o[last] = clone(op.v);
}
function stash(extra){
  try {
    if (!ops.length) { sDel(STASH); return; }
    var prev = {}; try { prev = JSON.parse(sGet(STASH) || '{}') || {}; } catch(e) {}
    sSet(STASH, JSON.stringify(Object.assign({base:S0.updatedAt, ops:ops, pid:prev.pid||null}, extra||{})));
  } catch(e) {}
}
(function restore(){
  var st = null;
  try { st = JSON.parse(sGet(STASH) || 'null'); } catch(e) {}
  if (!st || !st.ops || !st.ops.length) return;
  var landed = st.pid && (S0.log||[]).some(function(l){ return l.id === st.pid; });
  if (landed) { sDel(STASH); return; }
  if (st.base === S0.updatedAt) { ops = st.ops; ops.forEach(function(op){ applyOp(S, op); }); return; }
  replayOffer = st.ops;
})();

var sel = TODAY;
try { var ss = sessionStorage.getItem('vc-sel'); if (isDate(ss)) sel = ss; } catch(e) {}
var openSecs = {};

/* ---------- 日历模型 ---------- */
var HOL = {}, MK = {}, verCache = {}, HOLBLOCKS = [];
function rebuild(){
  HOL = {}; MK = {}; verCache = {}; HOLBLOCKS = [];
  (S.holidays||[]).forEach(function(h){
    if (!isDate(h.from) || !isDate(h.to)) return;
    for (var d = h.from, i = 0; d <= h.to && i < 60; d = addDays(d,1), i++) HOL[d] = h.name || '假期';
  });
  (S.makeup||[]).forEach(function(x){ if (isDate(x.date)) MK[x.date] = x.name || '调休上班'; });
  (S.holidays||[]).forEach(function(h){
    if (!isDate(h.from) || !isDate(h.to)) return;
    var lost = 0;
    for (var d = h.from, i = 0; d <= h.to && i < 60; d = addDays(d,1), i++) if (dow(d) < 5) lost++;
    HOLBLOCKS.push({from:h.from, to:h.to, name:h.name || '假期', lost:lost, shift: lost >= 3 ? Math.ceil(lost/5)*7 : 0});
  });
  HOLBLOCKS.sort(function(a,b){ return a.from < b.from ? -1 : 1; });
}
function isWork(s){ return MK[s] ? true : (!HOL[s] && dow(s) < 5); }
// 长假整体顺延：占掉 3 个及以上工作日的假期，假期当天及之后的所有节点后移整周（每 5 个工作日算 1 周）；
// 只占 1–2 个工作日的小假期不整体后移，只把落在假期当天的节点挪到下一个工作日。
function holShift(d){           // 只算“参照版本起始周”之后的长假：之前的假期已经体现在参照日期里了
  var add = 0, A = S.anchor.start;
  HOLBLOCKS.forEach(function(b){ if (b.from >= A && b.from <= d) add += b.shift; });
  return add;
}
function mapWorkday(base){ return nextWork(addDays(base, holShift(base))); }
function nextWork(s){ var t = s, i = 0; while (!isWork(t) && i++ < 60) t = addDays(t,1); return t; }
function pauseShift(s){
  var add = 0;
  (S.pauses||[]).forEach(function(p){ if (isDate(p.from) && p.from <= s) add += Number(p.weeks)||0; });
  return addDays(s, add*7);
}
function pauseWeeksBetween(a,b){
  var w = 0;
  (S.pauses||[]).forEach(function(p){ if (isDate(p.from) && p.from > a && p.from <= b) w += Number(p.weeks)||0; });
  return w;
}
function parseV(id){ var m = /^(\d+)\.(\d+)$/.exec(String(id||'').trim()); return m ? [Number(m[1]), Number(m[2])] : null; }
function idAt(n){
  var a = parseV(S.anchor.version); if (!a) return null;
  var M = Number(S.minorMax)||0;
  if (M > 0){
    var t = a[0]*(M+1) + a[1] + n;
    return t < 0 ? null : Math.floor(t/(M+1)) + '.' + (t%(M+1));
  }
  var b = a[1] + n; return b < 0 ? null : a[0] + '.' + b;
}
function colorOf(id){
  var p = parseV(id) || [0,0];
  return 'var(--c' + (((p[0]*7 + p[1]) % 8 + 8) % 8) + ')';
}
function stageInfo(name){
  var list = S.stages || [];
  for (var i=0;i<list.length;i++) if (list[i].name === name) return {i:i, s:list[i]};
  return {i:-1, s:{name:name, short:name, desc:''}};
}
function cmpEv(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.order - b.order); }
function version(n){
  if (verCache.hasOwnProperty(n)) return verCache[n];
  var id = idAt(n);
  if (!id){ verCache[n] = null; return null; }
  var base0 = addDays(S.anchor.start, n*S.cadenceWeeks*7);
  var start = pauseShift(base0);
  if (S.holidayRule === 'workday') start = mapWorkday(start);
  var evs = (S.template||[]).map(function(t,i){
    var base = pauseShift(addDays(base0, (Number(t.w)||0)*7 + (Number(t.d)||0)));
    var date = base, note = '';
    if (S.holidayRule === 'workday'){
      var sh = holShift(base);
      date = mapWorkday(base);
      if (date !== base) note = '原定 '+md(base)+'，'+(sh ? '长假整体顺延 '+(sh/7)+' 周' : (HOL[base]||'非工作日')+'顺延');
    } else if (S.holidayRule === 'shift'){
      date = nextWork(base);
      if (date !== base) note = '原定 '+md(base)+'，'+(HOL[base]||'非工作日')+'顺延';
    } else if (!isWork(base)) note = (HOL[base]||'非工作日')+'，待确认';
    var k = id+'|'+t.key, ov = (S.overrides||{})[k];
    if (ov && isDate(ov.date)){ date = ov.date; note = (ov.note ? ov.note+'，' : '已改期，') + '原定 '+md(base); }
    return {v:id, key:t.key, order:i, tw:(Number(t.w)||0), label:t.label, stage:t.stage, desc:t.desc||'', base:base, date:date, note:note,
            moved: date !== base, changed: !!(ov && isDate(ov.date)), flag: (S.flags||{})[k] || (S.flags||{})[id] || ''};
  });
  (S.extras||[]).forEach(function(e,i){
    if (e.v !== id || !isDate(e.date)) return;
    evs.push({v:id, key:'extra'+i, order:1000+i, label:e.label, stage:null, desc:e.note||'', base:e.date, date:e.date, note:'', moved:false, extra:true, flag:''});
  });
  evs.sort(cmpEv);
  var V = {id:id, n:n, start:start, evs:evs,
    first: evs.length ? (evs[0].date < start ? evs[0].date : start) : start,
    end: evs.length ? evs[evs.length-1].date : start};
  verCache[n] = V;
  return V;
}
function versionsIn(a,b){
  var per = Math.max(1, Number(S.cadenceWeeks)||2) * 7;
  var maxW = 0; (S.template||[]).forEach(function(t){ maxW = Math.max(maxW, Number(t.w)||0); });
  var pauseW = 0; (S.pauses||[]).forEach(function(p){ pauseW += Number(p.weeks)||0; });
  var span = (maxW+2)*7 + pauseW*7 + 30;
  var n0 = Math.floor((diff(S.anchor.start,a) - span)/per) - 1;
  var n1 = Math.ceil(diff(S.anchor.start,b)/per) + 1;
  var out = [];
  for (var n=n0; n<=n1; n++){
    var V = version(n);
    if (V && V.first <= b && V.end >= a) out.push(V);
  }
  return out;
}
function weekAt(V,d){
  var w = null;
  V.evs.forEach(function(e){ if (e.date <= d && e.tw != null) w = e.tw; });
  return (w == null ? 0 : w) + 1;
}
function stageAt(V,d){
  var s = null;
  V.evs.forEach(function(e){ if (e.date <= d && e.stage) s = e.stage; });
  return s || '未开始';
}
function eventsOn(d){
  var out = [];
  versionsIn(d,d).forEach(function(V){ V.evs.forEach(function(e){ if (e.date === d) out.push(e); }); });
  return out.sort(function(a,b){ return cmpEv(a,b) || (a.v < b.v ? -1 : 1); });
}
function templateByKey(k){ return (S.template||[]).find(function(t){ return t.key === k; }); }

/* ---------- 渲染：查看 ---------- */
function chip(e){
  var cls = 'chip' + (e.flag ? ' inf' : '') + (e.extra ? ' extra' : '');
  return '<span class="'+cls+'" style="--vc:'+colorOf(e.v)+'" title="'+esc(e.desc + (e.flag ? '（'+e.flag+'）' : ''))+'">'+
    '<span class="v">'+esc(e.v)+'</span>'+esc(e.label)+(e.note ? '<span class="n">'+esc(e.note)+'</span>' : '')+'</span>';
}

function viewHTML(){
  var gA = monthStart(sel,-1), gB = addDays(monthStart(sel,4), -1);
  var h = '';
  h += '<header><div><h1>'+esc(S.team)+' · 版本日历</h1>'+
       '<p class="sub">每 '+esc(S.cadenceWeeks)+' 周一版，按流程模板自动排到以后所有版本。点任意一天看当天各版本进度。</p></div>'+
       '<div class="controls"><button type="button" data-act="prevW">‹ 上周</button>'+
       '<button type="button" class="primary" data-act="today">回到今天</button>'+
       '<button type="button" data-act="nextW">下周 ›</button>'+
       '<input id="pick" type="date" aria-label="选择日期" value="'+sel+'">'+
       (MODE === 'claude' && downloadsApi ? '<button type="button" data-act="dlOffline" title="生成一个不需要 Claude 就能打开的网页文件">下载离线版</button>' : '')+
       '</div></header>';
  h += alertsHTML(gA, gB);
  h += dayHTML();
  h += weekHTML();
  h += ganttHTML(gA, gB);
  h += reqsHTML(gA, gB);
  h += ruleHTML();
  h += glossHTML();
  h += notesHTML(gA, gB);
  h += editHTML();

}

function alertsHTML(gA, gB){
  var out = '';
  if (replayOffer){
    out += '<div class="warn"><b>'+(MODE === 'file' ? '你之前在旧版网页里做过修改，还没合进这个版本。' : '有一份修改没保存成功</b>（可能是别人刚好先保存了）。<b>')+'</b>要在这个版本上重新应用吗？'+
      '<button type="button" data-act="replay">重新应用</button><button type="button" data-act="dropReplay">丢弃</button></div>';
  }
  var piles = [];
  for (var d = TODAY, i = 0; i < 90; d = addDays(d,1), i++){
    var n = eventsOn(d).length;
    if (n >= 6) piles.push(mdCN(d)+' '+WD[dow(d)]+'（'+n+' 个）');
  }
  if (piles.length) out += '<div class="warn"><b>节点扎堆：</b>'+piles.join('、')+'。一般是假期顺延造成的，实际安排建议和 mt 确认，确认后在下方「编辑 → 节点改期」里调整。</div>';
  var maxY = 0; (S.holidays||[]).forEach(function(x){ if (isDate(x.to)) maxY = Math.max(maxY, Number(x.to.slice(0,4))); });
  var needY = Number(gB.slice(0,4));
  if (needY > maxY) out += '<div class="warn"><b>'+needY+' 年的放假安排还没录入。</b>国务院一般在前一年 11 月前后公布，公布后在「编辑 → 假期与调休」里添加，节点会自动顺延。</div>';
  return out;
}

function dayHTML(){
  var tags = '';
  if (sel === TODAY) tags += '<span class="tag today">今天</span>';
  if (HOL[sel]) tags += '<span class="tag hol">'+esc(HOL[sel])+'假期</span>';
  if (MK[sel]) tags += '<span class="tag mk">'+esc(MK[sel])+'</span>';
  var active = versionsIn(sel, sel);
  var cards = active.map(function(V){
    var wk = weekAt(V, sel);
    var st = stageAt(V, sel), si = stageInfo(st);
    var todays = V.evs.filter(function(e){ return e.date === sel; });
    var nxt = V.evs.find(function(e){ return e.date > sel; });
    var vflag = (S.flags||{})[V.id];
    return '<article class="card" style="--vc:'+colorOf(V.id)+'">'+
      '<div class="card-top"><span class="vname">'+esc(V.id)+'</span><span class="wk">'+(sel < V.start ? '起始周之前' : weekName(wk))+' · '+WD[dow(sel)]+'</span></div>'+
      (vflag ? '<div><span class="tag inf">'+esc(vflag)+'</span></div>' : '')+
      '<div><span class="stage">'+esc(st)+'</span></div>'+
      '<div class="stage-desc">'+esc(st === '未开始' ? '还没到起始周' : si.s.desc)+'</div>'+
      '<div class="todo"><span class="lbl">当天节点</span>'+
      (todays.length ? todays.map(function(e){
        return '<div class="todo-item"><b>'+esc(e.label)+'</b>'+
          (e.flag && e.flag !== vflag ? ' <span class="tag inf">'+esc(e.flag)+'</span>' : '')+
          (e.note ? ' <span class="tag sh">'+esc(e.note)+'</span>' : '')+
          (e.desc ? '<p>'+esc(e.desc)+'</p>' : '')+'</div>';
      }).join('') : '<span class="none">当天没有节点</span>')+'</div>'+
      (nxt ? '<div class="next">下一个：<strong>'+esc(nxt.label)+'</strong> · '+md(nxt.date)+' '+WD[dow(nxt.date)]+'（'+diff(sel,nxt.date)+' 天后）</div>' : '')+
      '</article>';
  }).join('');
  return '<section aria-labelledby="h-day"><div class="sec-head"><h2 id="h-day">当天各版本进度</h2><span class="hint">虚线框 = 原表没有或空着、按规律推算的节点</span></div>'+
    '<div class="dayline"><span class="big">'+mdCN(sel)+' '+WD[dow(sel)]+'</span>'+tags+'</div>'+
    '<div class="cards">'+(cards || '<p class="none">这一天没有进行中的版本。</p>')+'</div></section>';
}

function weekHTML(){
  var ws = addDays(sel, -dow(sel));
  var days = [];
  for (var i=0;i<7;i++){
    var d = addDays(ws,i), evs = eventsOn(d);
    if (i < 5 || MK[d] || evs.length) days.push({d:d, evs:evs});
  }
  var cells = days.map(function(x){
    var d = x.d, cls = 'day' + (d === sel ? ' is-sel' : '') + (HOL[d] ? ' is-hol' : '');
    return '<div class="'+cls+'" data-day="'+d+'" tabindex="0" role="button" aria-pressed="'+(d===sel)+'">'+
      '<div class="day-h"><span class="d">'+WD[dow(d)]+' <span class="mono">'+md(d)+'</span></span>'+
      (d === TODAY ? '<span class="tag today">今天</span>' : '')+
      (HOL[d] ? '<span class="tag hol">'+esc(HOL[d])+'</span>' : '')+
      (MK[d] ? '<span class="tag mk">'+esc(MK[d])+'</span>' : '')+'</div>'+
      (x.evs.map(chip).join('') || '<span class="none">—</span>')+
      (x.evs.length >= 6 ? '<span class="tag sh">节点扎堆，建议和 mt 确认</span>' : '')+
      '</div>';
  }).join('');
  return '<section aria-labelledby="h-week"><div class="sec-head"><h2 id="h-week">本周节点</h2><span class="hint">'+mdCN(ws)+' – '+mdCN(addDays(ws,6))+'</span></div>'+
    '<div class="week" style="--cols:'+days.length+'">'+cells+'</div></section>';
}

function ganttHTML(A, B){
  var total = diff(A, B) + 1, LW = 56;
  var pos = function(s){ return 'calc('+LW+'px + (100% - '+LW+'px) * '+(diff(A,s)/total).toFixed(5)+')'; };
  var pct = function(s){ return (diff(A,s)/total*100).toFixed(3)+'%'; };
  var h = '<div class="g-axis">';
  for (var m = 0; m < 5; m++){ var ms = monthStart(A, m); h += '<span style="left:'+pos(ms)+'">'+ymCN(ms).replace(/^\d+年/, m===0 || ms.slice(5,7)==='01' ? ms.slice(0,4)+'年' : '')+'</span>'; }
  h += '</div>';
  Object.keys(HOL).forEach(function(d){ if (d >= A && d <= B) h += '<div class="g-band" style="left:'+pos(d)+';width:calc((100% - '+LW+'px) / '+total+')"></div>'; });
  var nStages = Math.max(1, (S.stages||[]).length - 1);
  versionsIn(A, B).forEach(function(V){
    var segs = [], cur = null, curStart = V.start;
    V.evs.forEach(function(e){
      if (!e.stage) return;
      if (cur === null){ cur = e.stage; curStart = V.start; return; }
      if (e.stage !== cur){ segs.push([cur, curStart, e.date]); cur = e.stage; curStart = e.date; }
    });
    if (cur !== null && segs.length && stageInfo(cur).i === (S.stages||[]).length - 1) { /* 已上线：不画 */ }
    else if (cur !== null) segs.push([cur, curStart, addDays(V.end,1)]);
    h += '<div class="g-row" style="--vc:'+colorOf(V.id)+'"><span class="rl">'+esc(V.id)+'</span><div class="g-track">';
    segs.forEach(function(sg){
      var a = sg[1] < A ? A : sg[1], b = sg[2] > addDays(B,1) ? addDays(B,1) : sg[2];
      var w = diff(a,b); if (w <= 0) return;
      var si = stageInfo(sg[0]), idx = Math.max(0, si.i);
      var mix = Math.round(20 + 80*idx/Math.max(1,nStages-1));
      h += '<div class="g-seg'+(mix >= 70 ? ' dark' : '')+'" style="--mix:'+Math.min(100,mix)+'%;left:'+pct(a)+';width:'+(w/total*100).toFixed(3)+'%" title="'+esc(V.id+' '+si.s.short+'：'+md(sg[1])+' – '+md(addDays(sg[2],-1)))+'">'+(w >= 5 ? esc(si.s.short) : '')+'</div>';
    });
    h += '</div></div>';
  });
  if (TODAY >= A && TODAY <= B) h += '<div class="g-line" style="left:'+pos(TODAY)+'"><b>今天</b></div>';
  if (sel !== TODAY && sel >= A && sel <= B) h += '<div class="g-line selL" style="left:'+pos(sel)+'"></div>';
  var legend = (S.stages||[]).slice(0,-1).map(function(s,i){
    return '<span><i style="--mix:'+Math.round(20 + 80*i/Math.max(1,nStages-1))+'%"></i>'+esc(s.short)+'</span>';
  }).join('') + '<span>颜色越深越接近上线；同一色系 = 同一版本</span>';
  return '<section aria-labelledby="h-g"><div class="sec-head"><h2 id="h-g">版本全景</h2><span class="hint">'+ymCN(A)+' – '+ymCN(B)+' · 红色底 = 法定假期 · 竖线 = 今天</span></div>'+
    '<div class="scroll"><div class="gantt"><div class="g-in">'+h+'</div></div></div><div class="legend">'+legend+'</div></section>';
}

function reqsHTML(A, B){
  var vs = versionsIn(sel, B).filter(function(V){ return V.end >= sel; });
  var cards = vs.map(function(V){
    var list = (S.reqs||{})[V.id] || [];
    return '<div class="req" style="--vc:'+colorOf(V.id)+'"><h3>'+esc(V.id)+'</h3>'+
      '<div class="hint">'+mdCN(V.start)+' 起 · '+esc(stageAt(V, sel))+'</div>'+
      (list.length ? '<ul class="plain">'+list.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')+'</ul>' : '<span class="none">需求待补充</span>')+'</div>';
  }).join('');
  return '<section aria-labelledby="h-req"><div class="sec-head"><h2 id="h-req">各版本需求</h2><span class="hint">在「编辑 → 版本需求」里填写</span></div><div class="reqs">'+cards+'</div></section>';
}

function ruleHTML(){
  var maxW = 0; (S.template||[]).forEach(function(t){ maxW = Math.max(maxW, Number(t.w)||0); });
  var h = '<thead><tr><th>版本内周次</th>'+WD.slice(0,5).map(function(d){ return '<th>'+d+'</th>'; }).join('')+'</tr></thead><tbody>';
  for (var w=0; w<=maxW; w++){
    h += '<tr><th>'+weekName(w+1)+'</th>';
    for (var d=0; d<5; d++){
      h += '<td>'+(S.template||[]).filter(function(t){ return Number(t.w)===w && Number(t.d)===d; }).map(function(t){ return '<div>'+esc(t.label)+'</div>'; }).join('')+'</td>';
    }
    h += '</tr>';
  }
  return '<section aria-labelledby="h-rule"><div class="sec-head"><h2 id="h-rule">一个版本的完整节奏</h2><span class="hint">所有版本都套这张表；流程变了在「编辑 → 流程模板」里改</span></div>'+
    '<div class="panel tbl-scroll"><table class="wide">'+h+'</tbody></table></div></section>';
}

var GLOSS = [
  ['MRD','Market Requirements Document，市场需求文档。讲清“为什么做、做什么”，是需求的立项材料。'],
  ['PRD','Product Requirements Document，产品需求文档。讲清“具体怎么做”，研发、测试、设计都照着它干活。'],
  ['组内 / 组外','组内 = 本方向自己的团队；组外 = 其他业务线或有依赖的兄弟团队。'],
  ['技术预审 vs 技术终审','预审在 MRD 阶段，研发粗评可行性和工作量；终审在 PRD 阶段，正式评方案并排期。'],
  ['流入终审','预审后被选中、继续写 PRD 并参加技术终审的需求。'],
  ['RDC','公司内部的研发协作平台，需求在这里绑定到版本（具体操作建议问 mt）。'],
  ['设计提需','给设计师提出稿需求，提需截止后再提可能排不上。'],

/* ---------- 保存 ---------- */
function buildDoc(next){
  var css = document.getElementById('css').textContent;
  var app = document.getElementById('app').textContent;
  var json = JSON.stringify(next).replace(/</g, '\\u003c');
  var C = '</', T = 'script>';
  return '<!doctype html>\n<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
    '<title>商详版本日历</title><style id="css">'+css+C+'style></head><body>'+
    '<div id="root"></div><script type="application/json" id="state">'+json+C+T+
    '<script id="app">'+app+C+T+'</body></html>';
}
function fileName(){ return 'version-calendar-' + TODAY.replace(/-/g,'') + '.html'; }
function nextState(pid){
  var next = clone(S);
  next.updatedAt = new Date().toISOString();
  if (ops.length) next.log = [{id:pid, at:TODAY, items:ops.map(function(o){ return o.text; })}].concat(next.log || []).slice(0,60);
  return next;
}
function saveFile(){
  var pid = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  var html = buildDoc(nextState(pid));
  try {
    var url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
    var a = document.createElement('a');
    a.href = url; a.download = fileName(); a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
    stash({pid:pid});
    say('已下载「'+fileName()+'」。把这个新文件发到群里，大家打开它就是最新版。', 'ok');
  } catch(e) {
    say('这个浏览器不支持下载（比如微信内置浏览器），请用 Chrome、Edge 或 Safari 打开，或把修改说明复制给'+(S.owner||'页面主人')+'。', 'err');
  }
}
function offlineDownload(){
  if (!downloadsApi) return;
  if (ops.length) { say('还有没保存的修改，先点「保存并发布」，再下载离线版。', 'err'); return; }
  downloadsApi.save({filename: fileName(), data: buildDoc(clone(S0))}).then(function(r){
    say(r && r.status === 'delivered' ? '已发送。' : '离线版已下载。发到飞书或微信群，大家用电脑浏览器打开即可，不需要 Claude。', 'ok');
  }).catch(function(err){
    var code = err && err.code;
    if (code === 'declined') return;
    if (code === 'rate_limited') { say('已经有一个下载确认框了，先处理它。', 'err'); return; }
    say('这里暂时不能下载离线版。', 'err');
  });
}
var READONLY_CODES = ['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'];
function save(retried){
  if (!ops.length || saving) return;
  if (MODE === 'file') { saveFile(); return; }
  if (!artifactApi){ readOnly = true; say('当前打开方式不能保存，可以把修改说明复制给'+(S.owner||'页面主人')+'。', 'err'); return; }
  var pid = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  var next = nextState(pid);
  stash({pid:pid});
  saving = true; say('保存中…');
  artifactApi.publish(buildDoc(next)).then(function(){
    saving = false; say('已保存，页面马上刷新到新版本。', 'ok');
  }).catch(function(err){
    saving = false;
    var code = err && err.code;
    if (code === 'conflict'){ say('别人刚保存了新版本，页面会刷新；刷新后可以把你的修改重新应用上去。'); return; }
    if (READONLY_CODES.indexOf(code) >= 0){ readOnly = true; say('你只有查看权限，修改没法直接保存。', 'err'); return; }
    if (code === 'rate_limited'){ say('保存太频繁了，稍等一分钟再点保存。', 'err'); return; }
    if (code === 'too_large'){ say('内容太多，超过了页面大小上限。可以删掉一些旧的改期记录再试。', 'err'); return; }
    if (code === 'invalid_content' || code === 'transform_error'){ say('页面内容生成出错，没有保存。请把问题告诉 Claude。', 'err'); return; }
    if (!retried){ setTimeout(function(){ save(true); }, 800 + Math.random()*1200); return; }
    say('保存失败（服务暂时不可用），修改还在，稍后再试。', 'err');
  });
}

  var dayEl = ev.target.closest('[data-day]');
  if (dayEl && !ev.target.closest('button')) { setSel(dayEl.dataset.day); return; }
  var b = ev.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  var act = b.dataset.act, i = Number(b.dataset.i);
  switch (act){
    case 'prevW': setSel(addDays(sel,-7)); break;
    case 'nextW': setSel(addDays(sel,7)); break;
    case 'today': setSel(TODAY); break;
    case 'addOv': {
      var v = val('o-v'), k = val('o-k'), d = val('o-d'), n = val('o-n');
      if (!v || !k || !isDate(d)) { say('请选好版本、节点和新日期。', 'err'); break; }
      var t = templateByKey(k);
      clearFields(['o-d','o-n']);
      change(['overrides', v+'|'+k], {date:d, note:n}, v+' '+(t?t.label:k)+' 改到 '+md(d)+(n?'（'+n+'）':''));
      break;
    }
    case 'delOv': {
      var key = b.dataset.k, p = key.split('|'), tt = templateByKey(p[1]);
      change(['overrides', key], null, '取消 '+p[0]+' '+(tt?tt.label:p[1])+' 的改期');
      break;
    }
    case 'addEx': {
      var xv = val('x-v'), xd = val('x-d'), xl = val('x-l'), xn = val('x-n');
      if (!xv || !isDate(xd) || !xl) { say('请填好版本、日期和事项。', 'err'); break; }
      clearFields(['x-d','x-l','x-n']);
      change(['extras'], (S.extras||[]).concat([{v:xv, date:xd, label:xl, note:xn}]), '新增 '+xv+' 事项「'+xl+'」（'+md(xd)+'）');
      break;
    }
    case 'delEx': {
      var ex = S.extras[i]; if (!ex) break;
      change(['extras'], S.extras.filter(function(_,j){ return j !== i; }), '删除 '+ex.v+' 事项「'+ex.label+'」');
      break;
    }
    case 'saveReq': {
      var rv = val('r-v');
      var lines = (document.getElementById('r-t').value || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      if (!rv) break;
      change(['reqs', rv], lines.length ? lines : null, '更新 '+rv+' 需求（'+lines.length+' 条）');
      break;
    }
    case 'addHol': {
      var hn = val('h-n'), ha = val('h-a'), hb = val('h-b') || ha;
      if (!hn || !isDate(ha) || !isDate(hb) || hb < ha) { say('请填假期名和正确的起止日期。', 'err'); break; }
      clearFields(['h-n','h-a','h-b']);
      change(['holidays'], (S.holidays||[]).concat([{from:ha, to:hb, name:hn}]), '新增假期 '+hn+' '+md(ha)+'–'+md(hb));
      break;
    }
    case 'delHol': {
      var hh = S.holidays[i]; if (!hh) break;
      change(['holidays'], S.holidays.filter(function(_,j){ return j !== i; }), '删除假期 '+hh.name+' '+md(hh.from));
      break;
    }
    case 'addMk': {
      var mdt = val('m-d');
      if (!isDate(mdt)) { say('请选择调休上班的日期。', 'err'); break; }
      clearFields(['m-d']);
      change(['makeup'], (S.makeup||[]).concat([{date:mdt, name:'调休上班'}]), '新增调休上班 '+md(mdt));
      break;
    }
    case 'delMk': {
      var mm = S.makeup[i]; if (!mm) break;
      change(['makeup'], S.makeup.filter(function(_,j){ return j !== i; }), '删除调休上班 '+md(mm.date));
      break;
    }
    case 'addPause': {
      var pa = val('p-a'), pw = Number(val('p-w')), pn = val('p-n');
      if (!isDate(pa) || !(pw >= 1)) { say('请填开始日期和后移周数。', 'err'); break; }
      clearFields(['p-a','p-n']);
      change(['pauses'], (S.pauses||[]).concat([{from:pa, weeks:pw, note:pn}]), md(pa)+' 起所有节点后移 '+pw+' 周'+(pn?'（'+pn+'）':''));
      break;
    }
    case 'delPause': {
      var pp = S.pauses[i]; if (!pp) break;
      change(['pauses'], S.pauses.filter(function(_,j){ return j !== i; }), '取消 '+md(pp.from)+' 起的暂停');
      break;
    }
    case 'basic': {
      var team = val('f-team'), av = val('f-av'), as = val('f-as'), cad = Number(val('f-cad')), mm = Number(val('f-mm')), hr = val('f-hr'), ow = val('f-owner');
      if (!parseV(av)) { say('版本号格式应为 数字.数字，例如 6.3', 'err'); break; }
      if (!isDate(as) || dow(as) !== 0) { say('起始周要选一个周一。', 'err'); break; }
      if (!(cad >= 1 && cad <= 8)) { say('每几周一版要在 1–8 之间。', 'err'); break; }
      var pend = [];
      if (team && team !== S.team) pend.push([['team'], team, '团队名改为 '+team]);
      if (av !== S.anchor.version || as !== S.anchor.start) pend.push([['anchor'], {version:av, start:as}, '参照版本改为 '+av+'（起始周 '+md(as)+'）']);
      if (cad !== Number(S.cadenceWeeks)) pend.push([['cadenceWeeks'], cad, '改为每 '+cad+' 周一版']);
      if (mm !== Number(S.minorMax)) pend.push([['minorMax'], mm, mm > 0 ? '小版本号到 .'+mm+' 进位' : '小版本号不进位']);
      if (hr !== S.holidayRule) pend.push([['holidayRule'], hr, hr === 'workday' ? '假期改为长假整体顺延' : hr === 'shift' ? '假期节点改为挪到节后第一个工作日' : '假期节点改为不动、只标记']);
      if (ow !== (S.owner||'')) pend.push([['owner'], ow, '页面主人改为 '+ow]);
      if (!pend.length) { say('基本设置没有变化。'); break; }
      pend.forEach(function(p){ var op = {path:p[0], v:p[1], text:p[2]}; ops.push(op); applyOp(S, op); });
      statusMsg = ''; stash(); render(false);
      break;
    }
    case 'addTpl': {
      var nt = (S.template||[]).concat([{key:'n'+Date.now().toString(36), w:0, d:0, label:'新节点', stage:(S.stages[0]||{}).name||'', desc:''}]);
      change(['template'], nt, '流程模板新增一个节点');
      break;
    }
    case 'delTpl': {
      var tr = S.template[i]; if (!tr) break;
      change(['template'], S.template.filter(function(_,j){ return j !== i; }), '流程模板删除「'+tr.label+'」');
      break;
    }
    case 'save': save(false); break;
    case 'dlOffline': offlineDownload(); break;
    case 'discard':
      ops = []; S = clone(S0); statusMsg = ''; readOnly = readOnly; stash(); render(false); break;
    case 'replay':
      replayOffer.forEach(function(op){ ops.push(op); applyOp(S, op); });
      replayOffer = null; stash(); render(); break;
    case 'dropReplay':
      replayOffer = null; sDel(STASH); render(); break;
    case 'copy': {
      var ta = document.getElementById('copy-t');
      var done = function(){ say('已复制。'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, function(){ ta.focus(); ta.select(); say('请按 Ctrl/⌘+C 复制选中的文字。'); });
      } else { ta.focus(); ta.select(); say('请按 Ctrl/⌘+C 复制选中的文字。'); }
      break;
    }
  }
});
root.addEventListener('keydown', function(ev){
  var dayEl = ev.target.closest && ev.target.closest('[data-day]');
  if (dayEl && ev.target === dayEl && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); setSel(dayEl.dataset.day); }
});
root.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.id === 'pick') { setSel(t.value); return; }
  if (t.id === 'r-v') {
    var ta = document.getElementById('r-t');
    if (ta) ta.value = ((S.reqs||{})[t.value] || []).join('\n');
    return;
  }
  var tf = t.dataset && t.dataset.tf;
  if (tf) {
    var i = Number(t.closest('tr').dataset.i), row = S.template[i]; if (!row) return;
    var v = tf === 'w' || tf === 'd' ? Number(t.value) : t.value.trim();
    if (row[tf] === v) return;
    var nt = clone(S.template); nt[i][tf] = v;
    var names = {w:'周次', d:'周几', label:'名称', stage:'阶段', desc:'说明'};
    change(['template'], nt, '流程节点「'+row.label+'」的'+names[tf]+'改为 '+(tf==='w'?weekName(v+1):tf==='d'?WD[v]:v));
  }
});
root.addEventListener('toggle', function(ev){
  var d = ev.target;
  if (d.tagName === 'DETAILS' && d.dataset.sec) openSecs[d.dataset.sec] = d.open;
}, true);

render(false);

if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(function(api){ artifactApi = api; }).catch(function(){ artifactApi = null; });
  window.claude.use('downloads').then(function(api){ downloadsApi = api; if (api) render(); }).catch(function(){ downloadsApi = null; });
}
})();
</script>
</body></html>
